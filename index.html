<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעבר לבית החדש</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הבית החדש">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e3e1da;--accent:#1f5f8b;--accent-ink:#fff;--done:#2e7d4f;--warn:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--ink:#e8eaee;--mute:#9aa3b2;--line:#2b3340;--accent:#6fb1e0;--accent-ink:#0d1520;--done:#5fbf86;--warn:#f2928b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--ink:#e8eaee;--mute:#9aa3b2;--line:#2b3340;--accent:#6fb1e0;--accent-ink:#0d1520;--done:#5fbf86;--warn:#f2928b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:720px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 6px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-bottom:4px}
.prog b{color:var(--ink);font-size:16px}
.sy{font-size:11px}
.tools{display:flex;gap:6px;margin:8px 0 2px}
.tools input{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
#fp{padding-top:6px}
.cards{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.card{flex:none;display:flex;flex-direction:column;align-items:center;min-width:92px;padding:8px 10px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:12px;cursor:pointer}
.card b{font-size:22px;line-height:1.1}
.card.lw b{color:var(--warn)}
.card.on b{color:inherit}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.seg{display:flex;gap:6px;margin:8px 0 0;overflow-x:auto}
button{font:inherit;color:var(--ink)}
.seg button,.chips button{font-size:14px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button{flex:1 0 auto;white-space:nowrap;padding:6px 10px;font-size:13px}
button.on,.pri{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap;font-size:13px;padding:4px 10px}
.hide{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-top:4px}
main{padding:10px 14px 110px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{color:var(--mute);font-weight:400}
summary.full small{color:var(--done)}
.t{display:flex;gap:2px;align-items:flex-start;padding-block:2px;padding-inline:4px 14px;border-top:1px solid var(--line)}
.ck{flex:none;display:flex;align-items:center;justify-content:center;width:46px;height:46px}
.t input{width:24px;height:24px;margin:0;accent-color:var(--done)}
.t .x{flex:1;min-width:0;cursor:pointer;padding:9px 0}
.t.d .tx{color:var(--mute);text-decoration:line-through}
.m{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:3px;font-size:12px;color:var(--mute)}
.m a{color:var(--accent)}
.m .w{color:var(--warn);font-weight:600}
.b{border:1px solid var(--line);border-radius:6px;padding:0 6px}
.b.st{background:var(--card);font:inherit;font-size:12px;color:var(--mute);cursor:pointer;padding:1px 8px}
.b.sw{color:var(--warn);border-color:var(--warn)}
.b.sd{color:var(--done);border-color:var(--done)}
.b.si{color:var(--accent);border-color:var(--accent)}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 0;box-sizing:border-box}
#sh2{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sh h2{font-size:18px;margin:0 0 4px}
.sh label{display:block;font-size:13px;color:var(--mute);margin:10px 0 2px}
.sh input,.sh select,.sh textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px;position:sticky;bottom:0;background:var(--card);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.row .del{flex:none;color:var(--warn)}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
details.more{background:none;border:0;margin:10px 0 0;overflow:visible}
.more summary{padding:8px 0;font-size:14px;color:var(--accent)}
.qs{display:block;width:100%;text-align:right;padding:12px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:10px;padding:8px 14px;z-index:30;display:flex;gap:14px;align-items:center;font-size:14px;white-space:nowrap}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:#8ec5ff;font-weight:600;cursor:pointer}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:12px 14px}
.pn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:16px}
.pa{display:flex;gap:8px;margin:8px 0;font-size:12px;color:var(--mute)}
.pb{flex:1;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:10px;color:var(--accent);text-decoration:none;font-size:14px}
button.pb{background:var(--card);cursor:pointer;font:inherit;font-size:14px}
.pt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.pt.d .l{color:var(--mute);text-decoration:line-through}
#m_o textarea{width:100%;box-sizing:border-box;margin-top:6px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.gr{display:flex}
.gl{flex:none;width:120px;position:sticky;left:0;z-index:2;background:var(--card);padding:0 8px;font-size:13px;line-height:30px;height:30px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-bottom:1px solid var(--line);box-sizing:border-box;cursor:pointer}
.gl.gs{font-weight:600;line-height:22px;height:22px;background:var(--bg);cursor:default}
.gt{position:relative;flex:none;height:30px;border-bottom:1px solid var(--line);box-sizing:border-box}
.gh{position:absolute;top:4px;font-size:10px;color:var(--mute);padding-left:2px}
.gb{position:absolute;top:6px;height:18px;border-radius:5px;cursor:pointer}
.gtd{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);opacity:.7}
.gd{opacity:.4}
.ty-b{background:#1f5f8b}.ty-a{background:#c77d0a}.ty-k{background:#a0457d}.ty-h{background:#1b8a8f}.ty-m{background:#6b7280}
.st-N{background:#9ca3af}.st-F{background:#d64545}.st-O{background:#e07b39}.st-D{background:#d4a017}.st-Q{background:#8e6bbf}.st-W{background:#3b82c4}.st-P{background:#1b8a8f}.st-X{background:#2e7d4f}
.gcb{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;cursor:pointer}
.cal{width:100%;margin-top:12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
a.cal{display:block;box-sizing:border-box;text-align:center;text-decoration:none;color:var(--accent)}
.cx{font-size:12px;color:var(--mute);white-space:pre-wrap;margin-top:6px;user-select:text;-webkit-user-select:text}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin:0 0 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px}
</style>
</head>
<body>
<header>
  <div class="prog"><b>🏠 מעבר לבית החדש</b><span id="sy" class="sy">נשמר במכשיר בלבד</span><span><span id="pt"></span> · <span id="pp"></span></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="seg" id="seg"></div>
  <div class="tools"><input id="q" type="search" placeholder="חיפוש משימה, חדר או שם…"><button id="ft">סינון</button><button id="mn" aria-label="גיבוי וייצוא">⋯</button></div>
  <div id="fp" hidden>
    <div class="chips" id="chips"></div>
    <div class="chips" id="chips2"></div>
    <label class="hide"><input type="checkbox" id="hd"> הסתר משימות שבוצעו</label>
  </div>
</header>
<main id="main"></main>
<button class="fab pri" id="add">＋ משימה חדשה</button>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<div class="ov" id="ov2"><div class="sh" id="sh2"></div></div>
<div class="toast" id="toast" hidden><span id="tt"></span><button id="tu">בטל</button></div>
<datalist id="rooms"></datalist><datalist id="trades"></datalist><datalist id="names"></datalist>
<script>
const RAW=[
"כללי|1|b|ניקיון|ניקיון אחרי שיפוצים",
"כללי|1|b|מנעולן|החלפת מנעולים וצילינדרים, שכפול מפתחות",
"כללי|1|b|הובלה|הובלה והחזרת ארגזים/אריזות",
"כללי|1|m||ביטוח דירה ותכולה",
"מנהלה|1|m||העברת חשבונות: חשמל, מים, גז, ארנונה, אינטרנט",
"מנהלה|1|m||עדכון כתובת: בנק, ביטוחים, משרד הפנים, קופת חולים, מוסדות חינוך",
"כללי|2|b|גבסן|גבס",
"כללי|2|b|אינסטלטור|חימום מים",
"כללי|2|b|תקשורת|תקשורת",
"כללי|3|b||הרכבת ארונות שלומי",
"כללי|3|b|מזגנאי|התקנת מזגנים ולד",
"כללי|3|a||תאורה: איסוף מ״לגעת באור״",
"כללי|3|b|חשמלאי|התקנת תאורה",
"כללי|3|b|חשמלאי|מאווררי תקרה",
"כללי|6|h||תמונות",
"כללי|6|h||מראות",
"מטבח|3|b|נגר|התקנת ארונות",
"מטבח|3|b|שיש|שיש",
"מטבח|3|b|אינסטלטור|כיור וברז",
"מטבח|3|b|אינסטלטור|טוחן אשפה: התקנה",
"מטבח|4|k||תנור",
"מטבח|4|k||מקרר",
"מטבח|4|k||כיריים",
"מטבח|4|k||מדיח",
"מטבח|4|k||מיקסר",
"מטבח|4|k||מעבד מזון",
"מטבח|4|b|גזרן|חיבור גז",
"סלון ופינת אוכל|5|k||ריהוט לאופרד",
"סלון ופינת אוכל|5|h||מדפי cubix",
"סלון ופינת אוכל|5|k||שולחן קפה deezen",
"סלון ופינת אוכל|5|a||טלוויזיה: איסוף מאלמ",
"סלון ופינת אוכל|5|k||שואב שוטף",
"שירותי אורחים|3|b|שיש|שיש",
"שירותי אורחים|3|b|אינסטלטור|כיור וברז: התקנה",
"שירותי ילדים|3|b|שיש|שיש + כיור",
"שירותי ילדים|3|b|אינסטלטור|ברז: התקנה",
"שירותי ילדים|3|b|מקלחונים|מקלחון",
"שירותי הורים|3|b|שיש|שיש + כיור",
"שירותי הורים|3|b|אינסטלטור|ברז: התקנה",
"שירותי הורים|3|b|מקלחונים|מקלחון",
"חדר הורים|5|k||מיטה deezen",
"חדר הורים|5|a||טלוויזיה: איסוף מאלמ",
"חדר הורים|5|h||הרכבת שידות",
"חדר הורים|5|k||כיסא איפור: לקנות",
"חדר שקד|5|h||שיפוץ מיטה",
"חדר שקד|5|h||כוורת",
"חדר שקד|5|h||ספרייה",
"חדר שקד|5|k||שולחן וכיסאות",
"חדר שקד|5|h||להרכיב מטבח עץ",
"חדר שקד|6|h||מדבקות קיר + לייסט עץ",
"חדר שקד|6|h||לוח מגנטי",
"משרד|5|a||ספה נפתחת: איילת ורונן",
"משרד|5|k||שולחן כתיבה",
"משרד|5|k||כיסא משרדי",
"משרד|5|k||ספרייה",
"חדר כביסה|4|a||מכונה ומייבש כביסה: איסוף מאלמ",
"חדר כביסה|6|h||מדפים",
"חדר כביסה|6|h||ארון",
"חדר כביסה|6|h||לוח דברים",
"חוץ ומרפסת|7|h||פרגולה",
"חוץ ומרפסת|7|b|גנן|גינה",
"חוץ ומרפסת|7|b|בטון|מחסן + משטח בטון",
"חוץ ומרפסת|7|k||מערכת ישיבה למרפסת"
];
const TY={a:"איסוף מחנות",k:"קנייה",h:"הרכבה עצמית",b:"בעל מקצוע",m:"מנהלה"};
const ST=["","לפני הכניסה ומנהלה","תשתיות ושיפוצים","התקנות קבועות","מכשירים וחיבורים","ריהוט והרכבות","גימורים ואביזרים","חוץ"];
const FD={
 b:[["trade","תחום (חשמלאי, אינסטלטור…)","text","trades"],["name","שם בעל המקצוע","text","names"],["phone","טלפון","tel"],["note","הערות","area"]],
 a:[["name","שם החנות","text","names"],["phone","טלפון","tel"],["ref","מספר הזמנה","text"],["note","הערות","area"]],
 k:[["name","חנות / ספק","text","names"],["phone","טלפון","tel"],["url","קישור","url"],["note","הערות","area"]],
 h:[["name","מי מרכיב","text","names"],["note","הערות","area"]],
 m:[["name","גוף / חברה","text","names"],["phone","טלפון","tel"],["ref","מספר לקוח / אסמכתא","text"],["note","הערות","area"]]
};
const NONE="ללא בעל מקצוע";
const SL=[["N","טרם התחיל"],["F","צריך למצוא בעל מקצוע","b"],["O","צריך להזמין / לקנות","ka"],["D","צריך לקבוע תאריך"],["Q","ממתין להצעה / תשובה"],["W","ממתין לביצוע"],["P","בתהליך"],["X","בוצע"]];
const SN=Object.fromEntries(SL.map(x=>[x[0],x[1]]));
const sok=(s,ty)=>{const r=SL.find(x=>x[0]===s);return !!r&&(!r[2]||r[2].includes(ty))};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S={t:0,tasks:RAW.map((s,i)=>{const p=s.split("|");return{id:i,room:p[0],stage:+p[1],type:p[2],trade:p[3],text:p[4],done:false,f:{}}})};
try{const j=JSON.parse(localStorage.getItem("nh_state")||"null");if(j&&j.tasks)S=j;else{JSON.parse(localStorage.getItem("nh_done")||"[]").forEach(i=>{const x=S.tasks.find(t=>t.id===i);if(x)x.done=true})}}catch(e){}
function norm(x){x.tasks.forEach(t=>{const f=t.f=t.f||{};if(!t.s)t.s=t.done?"X":"N";if(f.date){if(!f.start)f.start=f.date;if(!f.end)f.end=f.date;delete f.date}});return x}
norm(S);
let DB=null,tm=0,modalOpen=false,pending=null,view="room",ftype="all",fst="all",fx="all",qq="",us=null,tmr=0,gcol="ty",gg="stage",gzi=1,hide=false,ed=null;
const closed={};
function lsSave(){try{localStorage.setItem("nh_state",JSON.stringify(S))}catch(e){}}
let DB_URL="",CODE="",es=null,remote=null;
function readCfg(){try{const x=location.hash,c=x.match(/[#&]c=([A-Za-z0-9_-]{12,})/),d=x.match(/[#&]d=([^&]+)/);
  if(c){CODE=c[1];localStorage.setItem("nh_code",CODE)}else CODE=localStorage.getItem("nh_code")||"";
  if(d){DB_URL=decodeURIComponent(d[1]);localStorage.setItem("nh_db",DB_URL)}else DB_URL=localStorage.getItem("nh_db")||""}catch(e){}}
readCfg();
const cfgOk=()=>!!CODE&&/^https:\/\/[\w.-]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/.test(DB_URL.trim());
const dbUrl=()=>DB_URL.trim().replace(/\/+$/,"")+"/rooms/"+CODE+".json";
function sync(m){$("sy").textContent=m}
async function pushDb(){
  if(!cfgOk())return;
  try{const r=await fetch(dbUrl(),{method:"PUT",body:JSON.stringify({t:S.t,s:JSON.stringify(S)})});if(!r.ok)throw 0;sync("נשמר ומשותף")}catch(e){sync("נשמר במכשיר, ממתין לחיבור")}
}
function persist(){S.t=Date.now();lsSave();clearTimeout(tm);tm=setTimeout(pushDb,600)}
function onRemote(v){
  if(!v||!v.s){if(S.t>0)pushDb();sync("מסונכרן");return}
  try{const r=JSON.parse(v.s);
    if(r.t>S.t){if(modalOpen)pending=r;else{S=norm(r);lsSave();render()}}
    else if(r.t<S.t)pushDb();
  }catch(e){}
  sync("מסונכרן");
}
function connect(){
  if(es){es.close();es=null}
  if(!cfgOk()){sync("לא מחובר, נשמר במכשיר");return}

  const sh=$("sh");
  ed.text=sh.querySelector("#e_text").value;ed.room=sh.querySelector("#e_room").value;
  ed.stage=+sh.querySelector("#e_stage").value;ed.type=sh.querySelector("#e_type").value;const es=sh.querySelector("#e_stat");if(es&&es.value)ed.s=es.value;
  sh.querySelectorAll("[data-k]").forEach(i=>{const k=i.dataset.k;if(k==="trade")ed.trade=i.value;else ed.f[k]=i.value});
}
function dyn(){
  $("dyn").innerHTML=FD[ed.type].map(([k,l,ty,li])=>{
    const v=k==="trade"?ed.trade:ed.f[k];
    const inp=ty==="area"?'<textarea rows="3" data-k="'+k+'">'+esc(v)+"</textarea>":'<input data-k="'+k+'" type="'+ty+'" value="'+esc(v)+'"'+(li?' list="'+li+'"':"")+">";
    return "<label>"+l+"</label>"+inp}).join("");
  if(navigator.contacts&&navigator.contacts.select&&FD[ed.type].some(x=>x[0]==="phone")){
    const b=document.createElement("button");b.className="cal";b.textContent="📇 בחר מאנשי הקשר";
    b.onclick=async()=>{try{const r=await navigator.contacts.select(["name","tel"],{multiple:false});
      if(r&&r[0]){const n=document.querySelector('[data-k="name"]'),p=document.querySelector('[data-k="phone"]');
        if(n&&r[0].name&&r[0].name[0])n.value=r[0].name[0];if(p&&r[0].tel&&r[0].tel[0])p.value=r[0].tel[0]}}catch(e){}};
    $("dyn").prepend(b)}
}
function fillSt(){const sel=$("e_stat");if(!sok(ed.s,ed.type))ed.s="N";sel.innerHTML=SL.filter(x=>sok(x[0],ed.type)).map(x=>'<option value="'+x[0]+'"'+(ed.s===x[0]?" selected":"")+">"+x[1]+"</option>").join("")}
function openEd(id){
  const src=id==null?null:S.tasks.find(t=>t.id===id);
  ed=src?JSON.parse(JSON.stringify(src)):{id:null,room:"כללי",stage:1,type:"b",trade:"",text:"",done:false,s:"N",f:{}};
  ed.f=ed.f||{};modalOpen=true;
  const more=ed.trade||Object.keys(ed.f).some(k=>k!=="start"&&k!=="end"&&ed.f[k]);
  $("sh").innerHTML="<h2>"+(src?"פרטי משימה":"משימה חדשה")+'</h2><label>משימה</label><input id="e_text" value="'+esc(ed.text)+'">'+
    '<label>חדר / מקום</label><input id="e_room" list="rooms" value="'+esc(ed.room)+'">'+
    '<label>סטטוס</label><select id="e_stat"></select>'+
    '<div class="two"><div><label>סוג</label><select id="e_type">'+Object.entries(TY).map(([k,l])=>'<option value="'+k+'"'+(ed.type===k?" selected":"")+">"+l+"</option>").join("")+'</select></div><div><label>שלב</label><select id="e_stage">'+ST.slice(1).map((s,i)=>'<option value="'+(i+1)+'"'+(ed.stage===i+1?" selected":"")+">"+(i+1)+". "+s+"</option>").join("")+"</select></div></div>"+
    '<div class="two"><div><label>תאריך התחלה</label><input type="date" data-k="start" value="'+esc(ed.f.start)+'"></div><div><label>תאריך סיום</label><input type="date" data-k="end" value="'+esc(ed.f.end)+'"></div></div>'+
    '<a class="cal" id="e_cal" target="_blank" rel="noopener">📅 הוסף ליומן</a>'+
    '<details class="more"'+(more?" open":"")+'><summary>פרטים נוספים: שם, טלפון, הערות</summary><div id="dyn"></div></details>'+
    '<div class="row"><button class="pri" id="e_save">שמור</button><button id="e_cancel">ביטול</button>'+(src?'<button class="del" id="e_del">מחק</button>':"")+"</div>";
  dyn();
  fillSt();
  $("dyn").onchange=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k!=="name")return;const mt=S.tasks.find(t=>t.id!==ed.id&&t.f&&t.f.name===e.target.value&&(t.f.phone||t.trade));if(!mt)return;const ph=$("dyn").querySelector('[data-k="phone"]'),tr=$("dyn").querySelector('[data-k="trade"]');if(ph&&!ph.value&&mt.f.phone)ph.value=mt.f.phone;if(tr&&!tr.value&&mt.trade)tr.value=mt.trade};
  $("e_type").onchange=()=>{collect();dyn();fillSt()};
  const st=$("sh").querySelector('[data-k="start"]'),en=$("sh").querySelector('[data-k="end"]');
  st.dataset.p=st.value;
  st.onchange=()=>{if(!en.value||en.value<st.value||en.value===st.dataset.p)en.value=st.value;st.dataset.p=st.value};
  $("e_cancel").onclick=closeEd;
  const calUrl=()=>{
    collect();const f=ed.f,s=f.start;if(!s)return"";
    const e=f.end&&f.end>s?f.end:s,p=x=>x.replace(/-/g,""),nx=new Date(DN(e)*DAYMS+DAYMS).toISOString().slice(0,10);
    const det=[TY[ed.type],SN[ed.s],f.name,f.phone,f.url,f.note].filter(Boolean).join("\n");
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(ed.text)+"&dates="+p(s)+"/"+p(nx)+"&details="+encodeURIComponent(det)+"&location="+encodeURIComponent(ed.room);
  };
  const calUpd=()=>{const a=$("e_cal"),u=calUrl();if(u){a.href=u;a.textContent="📅 הוסף ליומן"}else a.removeAttribute("href")};
  $("sh").oninput=calUpd;$("sh").onchange=calUpd;calUpd();
  $("e_cal").onclick=ev=>{const u=calUrl();if(!u){ev.preventDefault();$("e_cal").textContent="קבע קודם תאריך התחלה";return}$("e_cal").href=u};
  $("e_save").onclick=()=>{
    collect();ed.text=ed.text.trim();if(!ed.text){$("e_text").focus();return}
    ed.room=ed.room.trim()||"כללי";ed.done=ed.s==="X";snap(ed.id==null?"המשימה נוספה":"השינויים נשמרו");
    if(ed.id==null){ed.id=S.tasks.reduce((m,t)=>Math.max(m,t.id),-1)+1;S.tasks.push(ed)}
    else{const i=S.tasks.findIndex(t=>t.id===ed.id);if(i>=0)S.tasks[i]=ed}
    persist();closeEd();
  };
  if(src){const b=$("e_del");b.onclick=()=>{
    if(b.dataset.s){snap("המשימה נמחקה");S.tasks=S.tasks.filter(t=>t.id!==ed.id);persist();closeEd()}
    else{b.dataset.s=1;b.textContent="לחץ שוב למחיקה"}}}
  $("ov").classList.add("on");
}
function closeEd(){
  $("ov").classList.remove("on");modalOpen=false;
  if(pending&&pending.t>S.t){S=norm(pending);lsSave()}
  pending=null;ed=null;render();
}
render();
if(!CODE||!DB_URL)setTimeout(openSetup,500);
connect();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
