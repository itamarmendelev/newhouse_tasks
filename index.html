.ty-b{background:#1f5f8b}.ty-a{background:#c77d0a}.ty-k{background:#a0457d}.ty-h{background:#1b8a8f}.ty-m{background:#6b7280}
.st-N{background:#9ca3af}.st-F{background:#d64545}.st-O{background:#e07b39}.st-D{background:#d4a017}.st-Q{background:#8e6bbf}.st-W{background:#3b82c4}.st-P{background:#1b8a8f}.st-X{background:#2e7d4f}
.gcb{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;cursor:pointer}
.cal{width:100%;margin-top:12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
a.cal{display:block;box-sizing:border-box;text-align:center;text-decoration:none;color:var(--accent)}

.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin:0 0 8px}

</style>
</head>

];
const TY={p:"מוצר",b:"בעל מקצוע",m:"מנהלה"};
const ST=["","לפני הכניסה ומנהלה","תשתיות ושיפוצים","התקנות קבועות","מכשירים וחיבורים","ריהוט והרכבות","גימורים ואביזרים","חוץ"];
const FD={
 b:[["trade","תחום (חשמלאי, אינסטלטור…)","text","trades"],["name","שם בעל המקצוע","text","names"],["phone","טלפון","tel"],["note","הערות","area"]],
 p:[["url","קישור למוצר","url"],["ref","מספר הזמנה","text"],["note","הערות","area"]],
 m:[["name","גוף / חברה","text","names"],["phone","טלפון","tel"],["ref","מספר לקוח / אסמכתא","text"],["note","הערות","area"]]
};

  const st=t.st||[];if(!st.length)return t.s||"N";

  return x.s===1?"P":"W"}
function MIG(t){
  const o=t.type,f=t.f;
  if(o==="k"||o==="a"||o==="h"){
    t.type="p";t.st=mkst(o==="h"?["קנייה","אספקה לבית","הרכבה"]:o==="a"?["קנייה","איסוף מהחנות","התקנה"]:DEF);const s=t.s;

  btns($("chips"),[["all","הכול"],...Object.entries(TY)],ftype,k=>{ftype=k;render()});
  btns($("chips2"),[["all","כל הסטטוסים"],...SL.map(x=>[x[0],x[1]])],fst,k=>{fst=k;render()});
  $("ft").textContent="סינון"+((ftype!=="all"||fst!=="all"||hide)?" •":"");
  const all=S.tasks,dn=all.filter(t=>t.done).length,opt=a=>[...new Set(a.filter(Boolean))].map(r=>'<option value="'+esc(r)+'">').join("");
  $("pt").textContent=dn+"/"+all.length;$("pp").textContent=Math.round(dn/(all.length||1)*100)+"%";$("pb").style.width=(dn/(all.length||1)*100)+"%";
  $("rooms").innerHTML=opt(all.map(t=>t.room));$("trades").innerHTML=opt(all.map(t=>t.trade));$("names").innerHTML=opt(all.flatMap(t=>[(t.f||{}).name,...(t.st||[]).map(x=>x.who)]));$("whos").innerHTML=opt([ME,...all.map(t=>t.w)]);
  if(view==="gantt"){gantt();return}
  if(view==="agenda"){agenda();return}
  const g=new Map();
  all.filter(pass).forEach(t=>{const k=keyOf(t);if(!g.has(k))g.set(k,[]);g.get(k).push(t)});
  const keys=[...g.keys()];
  if(view==="stage")keys.sort((a,b)=>parseInt(a)-parseInt(b));
  if(view==="trade")keys.sort((a,b)=>a===NONE?1:b===NONE?-1:a.localeCompare(b,"he"));
  $("main").innerHTML=cards();
  if(!keys.length){$("main").insertAdjacentHTML("beforeend",'<div class="empty">אין משימות להצגה 🎉</div>');return}
  keys.forEach(k=>grp(k,g.get(k)));
}
function tl(){const n=new Date(),p=x=>String(x).padStart(2,"0");return n.getFullYear()+"-"+p(n.getMonth()+1)+"-"+p(n.getDate())}
const DAYMS=86400000,DN=s=>Math.floor(Date.parse(s)/DAYMS);
function sch(t){const f=t.f||{};let s,e;if(t.type==="p"){const ds=(t.st||[]).map(x=>x.d).filter(Boolean).sort();if(!ds.length)return null;s=ds[0];e=ds[ds.length-1]}else{s=f.start||f.end||f.date;e=f.end||f.start||f.date}if(!s)return null;const a=DN(s);let b=DN(e);if(b<a)b=a;return[a,b]}
function gantt(){
  const m=$("main"),DW=[14,24,36,52][gzi],LW=120,today=DN(tl());
  const list=S.tasks.filter(pass);
  const sc=list.map(t=>({t,r:sch(t)})).filter(x=>x.r),un=list.filter(t=>!sch(t));
  m.innerHTML="";
  if(sc.length){
    const lo=Math.min(today,...sc.map(x=>x.r[0]))-2,hi=Math.max(today+21,...sc.map(x=>x.r[1]))+3,W=(hi-lo+1)*DW;
    const wd=new Date(lo*DAYMS).getUTCDay(),off=((7-wd)%7)*DW;
    const bg="background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:"+7*DW+"px 100%;background-position:"+off+"px 0;";
    let h='<div class="lg"><button class="gcb'+(gcol==="ty"?" on":"")+'" data-gc="ty">צבע לפי סוג</button><button class="gcb'+(gcol==="st"?" on":"")+'" data-gc="st">צבע לפי סטטוס</button><button class="gcb'+(gg==="stage"?" on":"")+'" data-gg="stage">קיבוץ: שלב</button><button class="gcb'+(gg==="room"?" on":"")+'" data-gg="room">קיבוץ: חדר</button><button class="gcb" data-gz="-1">−</button><button class="gcb" data-gz="1">＋</button></div><div class="lg">'+(gcol==="ty"?Object.entries(TY).map(([k,l])=>'<span><i class="ty-'+k+'"></i>'+l+"</span>"):SL.map(x=>'<span><i class="st-'+x[0]+'"></i>'+x[1]+"</span>")).join("")+'</div><div class="gw" dir="ltr"><div style="width:'+(LW+W)+'px"><div class="gr"><div class="gl gs"></div><div class="gt" style="width:'+W+"px;height:22px;"+bg+'">';
    for(let d=lo+((7-wd)%7);d<=hi;d+=7){const x=new Date(d*DAYMS);h+='<span class="gh" style="left:'+(d-lo)*DW+'px">'+x.getUTCDate()+"/"+(x.getUTCMonth()+1)+"</span>"}
    h+="</div></div>";
    const rooms=[...new Set(S.tasks.map(t=>t.room))],gk=t=>gg==="room"?t.room:t.stage,ord=t=>gg==="room"?rooms.indexOf(t.room):t.stage;
    sc.sort((a,b)=>ord(a.t)-ord(b.t)||a.r[0]-b.r[0]);
    let cs=null;
    sc.forEach(({t,r})=>{
      if(gk(t)!==cs){cs=gk(t);h+='<div class="gr"><div class="gl gs" dir="rtl">'+esc(gg==="room"?t.room:ST[t.stage])+'</div><div class="gt" style="width:'+W+'px;height:22px;'+bg+'"></div></div>'}
      h+='<div class="gr"><div class="gl" dir="rtl" data-e="'+t.id+'">'+esc(t.text)+'</div><div class="gt" style="width:'+W+"px;"+bg+'"><i class="gtd" style="left:'+(today-lo)*DW+'px"></i><b class="gb '+(gcol==="st"?"st-"+t.s:"ty-"+t.type+(t.done?" gd":""))+'" data-e="'+t.id+'" style="left:'+(r[0]-lo)*DW+"px;width:"+(r[1]-r[0]+1)*DW+'px"></b></div></div>'});
    h+="</div></div>";
    m.innerHTML=h;
    m.querySelectorAll("[data-gc]").forEach(b=>b.onclick=()=>{gcol=b.dataset.gc;render()});
    m.querySelectorAll("[data-gg]").forEach(b=>b.onclick=()=>{gg=b.dataset.gg;render()});
    m.querySelectorAll("[data-gz]").forEach(b=>b.onclick=()=>{gzi=Math.max(0,Math.min(3,gzi+ +b.dataset.gz));render()});
    m.querySelector(".gw").scrollLeft=Math.max(0,(today-lo)*DW-40);
  }else m.innerHTML='<div class="empty">אין עדיין משימות עם תאריכים.<br>לחץ על משימה ברשימה למטה והוסף תאריך התחלה וסיום.</div>';
  if(un.length){const d=document.createElement("details");d.open=!sc.length;d.innerHTML='<summary><span>ללא תאריכים</span><small>'+un.length+"</small></summary>"+un.map(t=>'<div class="t"><div class="x" data-e="'+t.id+'"><span class="tx">'+esc(t.text)+'</span><div class="m"><span>'+esc(t.room)+"</span></div></div></div>").join("");m.appendChild(d)}
}
$("main").addEventListener("change",e=>{const id=e.target.dataset&&e.target.dataset.c;if(id==null)return;const t=S.tasks.find(x=>x.id===+id);if(t){snap(e.target.checked?"סומן כבוצע":"הסימון בוטל");if(t.type==="p"&&t.st&&t.st.length){const p=t.pst||[];if(e.target.checked){t.pst=t.st.map(x=>x.s);t.st.forEach(x=>x.s=2)}else{t.st.forEach((x,i)=>x.s=p[i]!=null&&p[i]<2?p[i]:2);if(t.st.every(x=>x.s===2))t.st[t.st.length-1].s=0}t.s=calc(t);t.done=t.s==="X"}
  else{if(e.target.checked){t.ps=t.s;t.s="X"}else t.s=t.ps&&t.ps!=="X"?t.ps:"N";t.done=e.target.checked}
  t.u=Date.now();persist();render()}});
$("main").addEventListener("click",e=>{
  const c=e.target.closest("[data-card]");
  if(c){const k=c.dataset.card,v=k.slice(1);if(k[0]==="s")fst=fst===v?"all":v;else fx=fx===v?"all":v;render();return}
  const qa=e.target.closest("[data-qa]");if(qa){e.preventDefault();const k=qa.dataset.qa;addNew(view==="room"?{room:k}:view==="stage"?{stage:parseInt(k)}:k!==NONE?{type:"b",trade:k}:{});return}
  const sc=e.target.closest("[data-sc]");if(sc){const[a,b]=sc.dataset.sc.split("_"),t=S.tasks.find(x=>x.id===+a);if(t&&t.st[+b]){snap("השלב עודכן");const x=t.st[+b];x.s=(x.s+1)%3;t.s=calc(t);t.done=t.s==="X";t.u=Date.now();persist();render()}return}
  const q=e.target.closest("[data-s]");if(q){openQs(+q.dataset.s);return}
  if(e.target.closest("a"))return;const x=e.target.closest("[data-e]");if(x)openEd(+x.dataset.e)});
$("hd").addEventListener("change",e=>{hide=e.target.checked;render()});
function addNew(pre){
  if(pre&&pre.type){openEd(null,pre);return}
  $("sh2").innerHTML='<h2>מה להוסיף?</h2><button class="qs" data-t="p">🛒 מוצר (קנייה ← אספקה ← התקנה)</button><button class="qs" data-t="b">🔧 משימה לבעל מקצוע</button><button class="qs" data-t="m">📋 מנהלה / אחר</button>';
  $("sh2").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{$("ov2").classList.remove("on");openEd(null,Object.assign({},pre||{},{type:b.dataset.t}))});
  $("ov2").classList.add("on")}
$("add").onclick=()=>addNew({});
$("ov").addEventListener("click",e=>{if(e.target===$("ov"))closeEd()});

function collect(){
  const sh=$("sh");
  ed.text=sh.querySelector("#e_text").value;ed.room=sh.querySelector("#e_room").value;
  ed.stage=+sh.querySelector("#e_stage").value;ed.type=sh.querySelector("#e_type").value;const es=sh.querySelector("#e_stat");if(es&&!es.disabled&&es.value)ed.s=es.value;const ew=sh.querySelector("#e_who");if(ew)ed.w=ew.value.trim();stCollect();
  sh.querySelectorAll("[data-k]").forEach(i=>{const k=i.dataset.k;if(k==="trade")ed.trade=i.value;else ed.f[k]=i.value});
}
function dyn(){
  $("dyn").innerHTML=FD[ed.type].map(([k,l,ty,li])=>{
    const v=k==="trade"?ed.trade:ed.f[k];
    const inp=ty==="area"?'<textarea rows="3" data-k="'+k+'">'+esc(v)+"</textarea>":'<input data-k="'+k+'" type="'+ty+'" value="'+esc(v)+'"'+(li?' list="'+li+'"':"")+">";
    return "<label>"+l+"</label>"+inp}).join("");
}
function fillSt(){const sel=$("e_stat");
  if(ed.type==="p"){sel.disabled=true;sel.innerHTML="<option>"+SN[calc(ed)]+" (לפי מסלול המוצר)</option>";return}
  sel.disabled=false;if(!sok(ed.s,ed.type))ed.s="N";sel.innerHTML=SL.filter(x=>sok(x[0],ed.type)).map(x=>'<option value="'+x[0]+'"'+(ed.s===x[0]?" selected":"")+">"+x[1]+"</option>").join("")}
let soi=-1;
function stCollect(){if(!ed||ed.type!=="p"||!$("stp"))return;const q=$("stp");
  q.querySelectorAll("[data-sd]").forEach(i=>{ed.st[+i.dataset.sd].d=i.value});q.querySelectorAll("[data-sp]").forEach(i=>{ed.st[+i.dataset.sp].ph=i.value});q.querySelectorAll("[data-sw]").forEach(i=>{ed.st[+i.dataset.sw].who=i.value})}
function stRender(){
  const box=$("stp"),dt=$("e_dates");
  if(ed.type!=="p"){box.innerHTML="";dt.style.display="";return}
  dt.style.display="none";
  const on=new Set(ed.st.map(x=>x.n)),op=soi>=0&&soi<ed.st.length?soi:ed.st.findIndex(x=>x.s<2);
  box.innerHTML='<label>מסלול המוצר</label><div class="chips">'+PRE.map(n=>'<button type="button" class="'+(on.has(n)?"on":"")+'" data-pn="'+n+'">'+(on.has(n)?"✓ ":"")+n+"</button>").join("")+'</div><div class="two" style="margin-top:6px"><input id="e_sn" list="stepn" placeholder="שלב אחר…"><button type="button" class="cal" id="e_sa" style="margin:0;width:auto;padding:6px 16px">הוסף</button></div><datalist id="stepn">'+PRE.map(n=>'<option value="'+n+'">').join("")+"</datalist>"+
   ed.st.map((x,i)=>'<details class="sb"'+(i===op?" open":"")+"><summary><span>"+["○","◐","✓"][x.s]+" "+esc(x.n)+(x.d?" · "+fds(x.d):"")+'</span><button type="button" class="qa" data-rm="'+i+'" aria-label="הסר שלב">✕</button></summary>'+
     '<div class="seg">'+["טרם","◐ "+mid(x.n),"✓ בוצע"].map((l,k)=>'<button type="button" class="'+(x.s===k?"on":"")+'" data-ss="'+i+"_"+k+'">'+l+"</button>").join("")+"</div>"+
     '<div class="two"><div><label>תאריך</label><input type="date" data-sd="'+i+'" value="'+esc(x.d)+'"></div><div><label>טלפון</label><input type="tel" dir="ltr" data-sp="'+i+'" value="'+esc(x.ph)+'"></div></div>'+
     '<label>גורם (חנות / מוביל / מתקין)</label><input data-sw="'+i+'" list="names" value="'+esc(x.who)+'"></details>').join("")}
function openEd(id,pre){
  const src=id==null?null:S.tasks.find(t=>t.id===id);
  ed=src?JSON.parse(JSON.stringify(src)):{id:null,room:"כללי",stage:1,type:"b",trade:"",text:"",done:false,s:"N",w:"",u:0,f:{}};
  if(!src&&pre)Object.assign(ed,pre);ed.f=ed.f||{};modalOpen=true;soi=-1;ed.st=ed.st||[];if(ed.type==="p"&&!ed.st.length)ed.st=mkst(DEF);
  const more=ed.trade||Object.keys(ed.f).some(k=>k!=="start"&&k!=="end"&&ed.f[k]);
  $("sh").innerHTML="<h2>"+(src?"פרטי משימה":"משימה חדשה")+'</h2><label>משימה</label><input id="e_text" value="'+esc(ed.text)+'">'+
    '<label>חדר / מקום</label><input id="e_room" list="rooms" value="'+esc(ed.room)+'">'+
    '<div class="two"><div><label>סטטוס</label><select id="e_stat"></select></div><div><label>אחראי</label><input id="e_who" list="whos" value="'+esc(ed.w)+'" placeholder="מי אחראי?"></div></div>'+
    '<div class="two"><div><label>סוג</label><select id="e_type">'+Object.entries(TY).map(([k,l])=>'<option value="'+k+'"'+(ed.type===k?" selected":"")+">"+l+"</option>").join("")+'</select></div><div><label>שלב</label><select id="e_stage">'+ST.slice(1).map((s,i)=>'<option value="'+(i+1)+'"'+(ed.stage===i+1?" selected":"")+">"+(i+1)+". "+s+"</option>").join("")+"</select></div></div>"+
    '<div id="e_dates"><div class="two"><div><label>תאריך התחלה</label><input type="date" data-k="start" value="'+esc(ed.f.start)+'"></div><div><label>תאריך סיום</label><input type="date" data-k="end" value="'+esc(ed.f.end)+'"></div></div></div><div id="stp"></div>'+
    '<a class="cal" id="e_cal" target="_blank" rel="noopener">📅 הוסף ליומן</a>'+
    '<details class="more"'+(more?" open":"")+'><summary>פרטים נוספים: שם, טלפון, הערות</summary><div id="dyn"></div></details>'+
    '<div class="row"><button class="pri" id="e_save">שמור</button><button id="e_cancel">ביטול</button>'+(src?'<button class="del" id="e_del">מחק</button>':"")+"</div>";
  dyn();
  fillSt();stRender();
  $("stp").onclick=e=>{
    const b=e.target.closest("button");if(!b||ed.type!=="p")return;stCollect();
    if(b.dataset.pn){const n=b.dataset.pn,i=ed.st.findIndex(x=>x.n===n);if(i>=0)ed.st.splice(i,1);else{ed.st.push({n,s:0,d:"",who:"",ph:""});ed.st.sort((a,c)=>ord(a.n)-ord(c.n))}}
    else if(b.dataset.ss){const[i,k]=b.dataset.ss.split("_");ed.st[+i].s=+k;soi=+i}
    else if(b.dataset.rm!=null){e.preventDefault();ed.st.splice(+b.dataset.rm,1);soi=-1}
    else if(b.id==="e_sa"){const v=$("e_sn").value.trim();if(!v)return;ed.st.push({n:v,s:0,d:"",who:"",ph:""});soi=ed.st.length-1}
    else return;
    stRender();fillSt()};
  $("stp").onchange=e=>{const i=e.target.dataset&&e.target.dataset.sw;if(i==null)return;const o=S.tasks.flatMap(t=>[{w:(t.f||{}).name,p:(t.f||{}).phone},...(t.st||[]).map(x=>({w:x.who,p:x.ph}))]).find(o=>o.w===e.target.value&&o.p),ph=$("stp").querySelector('[data-sp="'+i+'"]');if(o&&ph&&!ph.value)ph.value=o.p};
  $("dyn").onchange=e=>{const k=e.target.dataset&&e.target.dataset.k;if(k!=="name")return;const mt=S.tasks.find(t=>t.id!==ed.id&&t.f&&t.f.name===e.target.value&&(t.f.phone||t.trade));if(!mt)return;const ph=$("dyn").querySelector('[data-k="phone"]'),tr=$("dyn").querySelector('[data-k="trade"]');if(ph&&!ph.value&&mt.f.phone)ph.value=mt.f.phone;if(tr&&!tr.value&&mt.trade)tr.value=mt.trade};
  $("e_type").onchange=()=>{collect();if(ed.type==="p"&&!ed.st.length)ed.st=mkst(DEF);dyn();fillSt();stRender()};
  const st=$("sh").querySelector('[data-k="start"]'),en=$("sh").querySelector('[data-k="end"]');
  st.dataset.p=st.value;
  st.onchange=()=>{if(!en.value||en.value<st.value||en.value===st.dataset.p)en.value=st.value;st.dataset.p=st.value};
  $("e_cancel").onclick=closeEd;
  const calUrl=()=>{
    collect();const f=ed.f;let s=f.start,e=f.end,ti=ed.text,ex=[f.name,f.phone];
    if(ed.type==="p"){const x=(ed.st||[]).find(y=>y.s<2&&y.d);if(!x)return"";s=x.d;e=x.d;ti=ed.text+": "+x.n;ex=[x.who,x.ph]}
    if(!s)return"";
    e=e&&e>s?e:s;const p=x=>x.replace(/-/g,""),nx=new Date(DN(e)*DAYMS+DAYMS).toISOString().slice(0,10);
    const det=[TY[ed.type],ed.type==="p"?"":SN[ed.s],...ex,f.url,f.note].filter(Boolean).join("\n");
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(ti)+"&dates="+p(s)+"/"+p(nx)+"&details="+encodeURIComponent(det)+"&location="+encodeURIComponent(ed.room);
  };
  const calUpd=()=>{const a=$("e_cal"),u=calUrl();if(u){a.href=u;a.textContent="📅 הוסף ליומן"}else a.removeAttribute("href")};
  $("sh").oninput=calUpd;$("sh").onchange=calUpd;calUpd();
  $("e_cal").onclick=ev=>{const u=calUrl();if(!u){ev.preventDefault();$("e_cal").textContent="קבע קודם תאריך התחלה";return}$("e_cal").href=u};
  $("e_save").onclick=()=>{
    collect();ed.text=ed.text.trim();if(!ed.text){$("e_text").focus();return}
    ed.room=ed.room.trim()||"כללי";if(ed.type==="p")ed.s=calc(ed);ed.done=ed.s==="X";ed.u=Date.now();snap(ed.id==null?"המשימה נוספה":"השינויים נשמרו");
    if(ed.id==null){ed.id=Date.now()*1000+Math.floor(Math.random()*1000);S.tasks.push(ed)}
    else{const i=S.tasks.findIndex(t=>t.id===ed.id);if(i>=0)S.tasks[i]=ed}
    persist();closeEd();
  };
  if(src){const b=$("e_del");b.onclick=()=>{
    if(b.dataset.s){snap("המשימה נמחקה");S.del[ed.id]=Date.now();S.tasks=S.tasks.filter(t=>t.id!==ed.id);persist();closeEd()}
    else{b.dataset.s=1;b.textContent="לחץ שוב למחיקה"}}}
  $("ov").classList.add("on");
}
function closeEd(){
  $("ov").classList.remove("on");modalOpen=false;
  const pe=pending;pending=null;ed=null;if(pe)applyRemote(pe);render();
}
