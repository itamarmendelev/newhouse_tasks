<style>

:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--ink:#e8eaee;--mute:#9aa3b2;--line:#2b3340;--accent:#6fb1e0;--accent-ink:#0d1520;--done:#5fbf86;--warn:#f2928b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:720px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 6px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin-bottom:4px}
.prog b{color:var(--ink);font-size:16px}
.sy{font-size:11px}
.tools{display:flex;gap:6px;margin:8px 0 2px}
.tools input{flex:1;min-width:0;font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
#fp{padding-top:6px}
.cards{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.card{flex:none;display:flex;flex-direction:column;align-items:center;min-width:92px;padding:8px 10px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:12px;cursor:pointer}
.card b{font-size:22px;line-height:1.1}
.card.lw b{color:var(--warn)}
.card.on b{color:inherit}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.seg{display:flex;gap:6px;margin:8px 0 0;overflow-x:auto}
button{font:inherit;color:var(--ink)}
.seg button,.chips button{font-size:14px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer}
.seg button{flex:1 0 auto;white-space:nowrap;padding:6px 10px;font-size:13px}
button.on,.pri{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap;font-size:13px;padding:4px 10px}
.hide{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-top:4px}
main{padding:10px 14px 110px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{color:var(--mute);font-weight:400}
summary.full small{color:var(--done)}
.t{display:flex;gap:2px;align-items:flex-start;padding-block:2px;padding-inline:4px 14px;border-top:1px solid var(--line)}
.ck{flex:none;display:flex;align-items:center;justify-content:center;width:46px;height:46px}
.t input{width:24px;height:24px;margin:0;accent-color:var(--done)}
.t .x{flex:1;min-width:0;cursor:pointer;padding:9px 0}
.t.d .tx{color:var(--mute);text-decoration:line-through}
.m{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:3px;font-size:12px;color:var(--mute)}
.m a{color:var(--accent)}
.m .w{color:var(--warn);font-weight:600}
.b{border:1px solid var(--line);border-radius:6px;padding:0 6px}
.b.st{background:var(--card);font:inherit;font-size:12px;color:var(--mute);cursor:pointer;padding:1px 8px}
.b.sw{color:var(--warn);border-color:var(--warn)}
.b.sd{color:var(--done);border-color:var(--done)}
.b.si{color:var(--accent);border-color:var(--accent)}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 0;box-sizing:border-box}
#sh2{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sh h2{font-size:18px;margin:0 0 4px}
.sh label{display:block;font-size:13px;color:var(--mute);margin:10px 0 2px}
.sh input,.sh select,.sh textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px;position:sticky;bottom:0;background:var(--card);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.row button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.row .del{flex:none;color:var(--warn)}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
details.more{background:none;border:0;margin:10px 0 0;overflow:visible}
.more summary{padding:8px 0;font-size:14px;color:var(--accent)}
.qs{display:block;width:100%;text-align:right;padding:12px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:15px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:10px;padding:8px 14px;z-index:30;display:flex;gap:14px;align-items:center;font-size:14px;white-space:nowrap}
.toast[hidden]{display:none}
.gp{flex:1;height:6px;background:var(--line);border-radius:3px;margin:0 12px;overflow:hidden}
.gp b{display:block;height:100%;background:var(--done)}
summary>span{flex:none}
.qa{flex:none;margin-inline-start:10px;width:30px;height:30px;border:1px solid var(--line);background:var(--card);border-radius:50%;font-size:18px;line-height:1;color:var(--accent);cursor:pointer}
details.dn{border:0;border-radius:0;margin:0;border-top:1px dashed var(--line)}
details.dn summary{font-weight:400;font-size:13px;color:var(--mute);padding:8px 14px}
.pp{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 14px 8px;font-size:13px}
.pp a{color:var(--accent);text-decoration:none}
.sc{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:2px 9px;cursor:pointer}
.sc.s1{color:var(--accent);border-color:var(--accent)}
.sc.s2{color:var(--done);border-color:var(--done)}
details.sb{background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:visible}
details.sb summary{padding:8px 10px;font-size:14px}
details.sb>*:not(summary){margin-inline:10px}
details.sb>*:last-child{margin-bottom:10px}
.ty-p{background:#a0457d}.st-V{background:#7a6ff0}.st-H{background:#c08a2c}
.toast button{background:none;border:0;color:#8ec5ff;font-weight:600;cursor:pointer}
#m_o textarea{width:100%;box-sizing:border-box;margin-top:6px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.gr{display:flex}
.gl{flex:none;width:120px;position:sticky;left:0;z-index:2;background:var(--card);padding:0 8px;font-size:13px;line-height:30px;height:30px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-bottom:1px solid var(--line);box-sizing:border-box;cursor:pointer}
.gl.gs{font-weight:600;line-height:22px;height:22px;background:var(--bg);cursor:default}
.gt{position:relative;flex:none;height:30px;border-bottom:1px solid var(--line);box-sizing:border-box}
.gh{position:absolute;top:4px;font-size:10px;color:var(--mute);padding-left:2px}
.gb{position:absolute;top:6px;height:18px;border-radius:5px;cursor:pointer}

.gd{opacity:.4}
.ty-b{background:#1f5f8b}.ty-a{background:#c77d0a}.ty-k{background:#a0457d}.ty-h{background:#1b8a8f}.ty-m{background:#6b7280}

a.cal{display:block;box-sizing:border-box;text-align:center;text-decoration:none;color:var(--accent)}
.cx{font-size:12px;color:var(--mute);white-space:pre-wrap;margin-top:6px;user-select:text;-webkit-user-select:text}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin:0 0 8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px}

.bar{margin:6px 0 0}
.nav{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:12px;margin:8px 0 6px}

.fcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.fcd{border:1px solid var(--line);border-top-width:4px;border-radius:16px;background:var(--card);padding:10px 4px;text-align:center;cursor:pointer}

.pc2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.pn2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:16px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.eh{display:flex;align-items:center;justify-content:space-between}
.eh h2{margin:0}
#e_x{border:0;background:var(--line);border-radius:50%;width:32px;height:32px;cursor:pointer}
.etabs{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:12px;margin:10px 0 4px}
.big{font-size:18px!important;font-weight:600}
.sh{border-radius:24px 24px 0 0!important}
.st-C,.st-Y{background:#8e6bbf}.st-S{background:#3b82c4}.st-K{background:#d4a017}.st-A{background:#e07b39}.st-M{background:#d64545}.st-G{background:#1b8a8f}.st-W{background:#9ca3af}
</style>
</head>

  '<label>סוג</label><div class="seg">'+TYB.map(([k,l])=>'<button type="button" data-ty="'+k+'" class="'+(ed.type===k?"on":"")+'">'+l+"</button>").join("")+"</div>"+
  '<label>חדר / מקום</label><input id="e_room" list="rooms" value="'+esc(ed.room)+'">'+
  '<label>שלב במעבר</label><select id="e_stage">'+ST.slice(1).map((s,i)=>'<option value="'+(i+1)+'"'+(ed.stage===i+1?" selected":"")+">"+(i+1)+". "+s+"</option>").join("")+"</select>"+
  '<div class="two"><div><label>סטטוס</label><select id="e_stat"></select></div><div><label>אחראי</label><input id="e_who" list="whos" value="'+esc(ed.w)+'" placeholder="מי אחראי?"></div></div>'}
function stepsHtml(){
  const on=new Set(ed.st.map(x=>x.n)),op=soi>=0&&soi<ed.st.length?soi:ed.st.findIndex(x=>!x.dn);
  return '<label>מסלול המוצר</label><div class="chips">'+PRE.map(n=>'<button type="button" class="'+(on.has(n)?"on":"")+'" data-pn="'+n+'">'+(on.has(n)?"✓ ":"")+n+"</button>").join("")+'</div><div class="two" style="margin-top:6px"><input id="e_sn" list="stepn" placeholder="שלב אחר…"><button type="button" class="cal" id="e_sa" style="margin:0;width:auto;padding:6px 16px">הוסף</button></div><datalist id="stepn">'+PRE.map(n=>'<option value="'+n+'">').join("")+"</datalist>"+
  ed.st.map((x,i)=>'<details class="sb"'+(i===op?" open":"")+"><summary><span>"+(x.dn?"✓":"○")+" "+esc(x.n)+(x.d?" · "+dt(x.d,x.tm):"")+'</span><button type="button" class="qa" data-rm="'+i+'" aria-label="הסר שלב">✕</button></summary>'+
   '<div class="seg">'+["טרם","✓ בוצע"].map((l,k)=>'<button type="button" class="'+((x.dn?1:0)===k?"on":"")+'" data-ss="'+i+"_"+k+'">'+l+"</button>").join("")+"</div>"+
   '<div class="two"><div><label>תאריך</label><input type="date" data-sd="'+i+'" value="'+esc(x.d)+'"></div><div><label>שעה</label><input type="time" data-st="'+i+'" value="'+esc(x.tm)+'"></div></div>'+
   '<div class="two"><div><label>גורם (חנות / מוביל / מתקין)</label><input data-sw="'+i+'" list="names" value="'+esc(x.who)+'"></div><div><label>טלפון</label><input type="tel" dir="ltr" data-sp="'+i+'" value="'+esc(x.ph)+'"></div></div>'+
   '<label>אחראי מאיתנו</label><input data-sb="'+i+'" list="whos" value="'+esc(x.by)+'"></details>').join("")+calLink()}
function p2(){
  if(ed.type==="p")return stepsHtml();
  if(ed.type==="m")return '<label>מועד אחרון</label><input type="date" data-k="end" value="'+esc(ed.f.end)+'">'+calLink();
  return '<div class="two"><div><label>תאריך התחלה</label><input type="date" data-k="start" value="'+esc(ed.f.start)+'"></div><div><label>תאריך סיום</label><input type="date" data-k="end" value="'+esc(ed.f.end)+'"></div></div>'+calLink()}
function p3(){return FD[ed.type].map(([k,l,ty,li])=>{const v=k==="trade"?ed.trade:ed.f[k];return "<label>"+l+"</label>"+(ty==="area"?'<textarea rows="4" data-k="'+k+'">'+esc(v)+"</textarea>":'<input data-k="'+k+'" type="'+ty+'" value="'+esc(v)+'"'+(li?' list="'+li+'"':"")+">")}).join("")+(ed.type==="p"?'<div class="m" style="margin-top:12px">פרטי החנות, המוביל והמתקין נמצאים בכל שלב, בלשונית ״תאריכים ושלבים״.</div>':"")}
function setEt(n){etab=n;[1,2,3].forEach(i=>{$("p"+i).hidden=i!==n});$("sh").querySelectorAll("[data-et]").forEach(b=>b.classList.toggle("on",+b.dataset.et===n))}
function rePanes(){$("p1").innerHTML=p1();$("p2").innerHTML=p2();$("p3").innerHTML=p3();fillSt();calUpd();$("sh").querySelectorAll('[data-k="start"]').forEach(i=>i.dataset.p=i.value);const a=$("e_x");setEt(etab)}
function calUrl(){
  collect();const f=ed.f;let s=f.start,e=f.end,ti=ed.text,tm0="",ex=[f.name,f.phone];
  if(ed.type==="p"){const x=(ed.st||[]).find(y=>!y.dn&&y.d);if(!x)return "";s=x.d;e=x.d;tm0=x.tm||"";ti=ed.text+": "+x.n;ex=[x.who,x.ph]}
  if(!s)return "";
  const p=x=>x.replace(/-/g,"");let dates;
  if(tm0){const[H,M]=tm0.split(":").map(Number),eh=Math.min(H+1,23),em=H+1>23?59:M,z=n=>String(n).padStart(2,"0");dates=p(s)+"T"+z(H)+z(M)+"00/"+p(s)+"T"+z(eh)+z(em)+"00"}
  else{e=e&&e>s?e:s;dates=p(s)+"/"+p(new Date(DN(e)*DAYMS+DAYMS).toISOString().slice(0,10))}
  const det0=[TY[ed.type],ed.type==="p"?"":SN[ed.s],...ex,f.url,f.note].filter(Boolean).join("\n");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(ti)+"&dates="+dates+"&details="+encodeURIComponent(det0)+"&location="+encodeURIComponent(ed.room)}
function calUpd(){const a=$("e_cal");if(!a||!ed)return;const u=calUrl();if(u){a.href=u;a.textContent="📅 הוסף ליומן"}else a.removeAttribute("href")}
function known(n){let r={};S.tasks.forEach(t=>{const f=t.f||{};if(f.name===n&&f.phone)r.p=r.p||f.phone;if(f.name===n&&t.trade)r.tr=r.tr||t.trade;(t.st||[]).forEach(x=>{if(x.who===n&&x.ph)r.p=r.p||x.ph})});return r}
function saveEd(){
  collect();ed.text=ed.text.trim();if(!ed.text){setEt(1);$("e_text").focus();return}
  ed.room=ed.room.trim()||"כללי";
  if(ed.type==="p")ed.s=calc(ed);else if(!sok(ed.s,ed.type))ed.s=DEFS[ed.type];
  ed.done=ed.s==="X";ed.u=Date.now();snap(ed.id==null?"המשימה נוספה":"השינויים נשמרו");
  if(ed.id==null){ed.id=Date.now()*1000+Math.floor(Math.random()*1000);S.tasks.push(ed)}
  else{const i=S.tasks.findIndex(t=>t.id===ed.id);if(i>=0)S.tasks[i]=ed}
  persist();closeEd()}
function editorClick(e){
  const b=e.target.closest("button,a");if(!b)return;
  if(b.dataset.et){setEt(+b.dataset.et);return}
  if(b.id==="e_x"||b.id==="e_cancel"){closeEd();return}
  if(b.id==="e_save"){saveEd();return}
  if(b.id==="e_del"){if(b.dataset.s){snap("המשימה נמחקה");S.del[ed.id]=Date.now();S.tasks=S.tasks.filter(t=>t.id!==ed.id);persist();closeEd()}else{b.dataset.s=1;b.textContent="לחץ שוב למחיקה"}return}
  if(b.id==="e_cal"){const u=calUrl();if(!u){e.preventDefault();b.textContent="קבע קודם תאריך";return}b.href=u;return}
  if(b.dataset.ty){collect();ed.type=b.dataset.ty;if(ed.type==="p"&&!ed.st.length)ed.st=mkst(DEF);if(ed.type==="m"&&ed.f.end)ed.f.start=ed.f.end;rePanes();return}
  if(ed.type!=="p")return;stCollect();
  if(b.dataset.pn){const n=b.dataset.pn,i=ed.st.findIndex(x=>x.n===n);if(i>=0)ed.st.splice(i,1);else{ed.st.push({n,dn:false,d:"",tm:"",who:"",ph:"",by:""});ed.st.sort((a,c)=>ord(a.n)-ord(c.n))}}
  else if(b.dataset.ss){const[i,k]=b.dataset.ss.split("_");ed.st[+i].dn=k==="1";soi=+i}
  else if(b.dataset.rm!=null){e.preventDefault();ed.st.splice(+b.dataset.rm,1);soi=-1}
  else if(b.id==="e_sa"){const v=$("e_sn").value.trim();if(!v)return;ed.st.push({n:v,dn:false,d:"",tm:"",who:"",ph:"",by:""});soi=ed.st.length-1}
  else return;
  $("p2").innerHTML=p2();fillSt();calUpd()}
function openEd(id,pre){
  const src=id==null?null:S.tasks.find(t=>t.id===id);
  ed=src?JSON.parse(JSON.stringify(src)):{id:null,room:"כללי",stage:1,type:"b",trade:"",text:"",done:false,s:"F",w:"",u:0,f:{},st:[]};
  if(!src&&pre)Object.assign(ed,pre);ed.f=ed.f||{};ed.st=ed.st||[];if(!src)ed.s=DEFS[ed.type]||"F";
  if(ed.type==="p"&&!ed.st.length)ed.st=mkst(DEF);
  modalOpen=true;soi=-1;etab=1;
  $("sh").innerHTML='<div class="eh"><h2>'+(src?"פרטי משימה":"משימה חדשה")+'</h2><button type="button" id="e_x" aria-label="סגור">✕</button></div><div class="etabs">'+[[1,"📌 פרטים"],[2,"📅 תאריכים ושלבים"],[3,"👤 ספקים והערות"]].map(([k,l])=>'<button type="button" data-et="'+k+'" class="'+(k===1?"on":"")+'">'+l+"</button>").join("")+'</div><div class="pane" id="p1">'+p1()+'</div><div class="pane" id="p2" hidden>'+p2()+'</div><div class="pane" id="p3" hidden>'+p3()+'</div><div class="row"><button class="pri" id="e_save">שמור</button><button id="e_cancel">ביטול</button>'+(src?'<button class="del" id="e_del">מחק</button>':"")+"</div>";
  fillSt();calUpd();
  $("sh").querySelectorAll('[data-k="start"]').forEach(i=>i.dataset.p=i.value);
  $("sh").onclick=editorClick;
  $("sh").oninput=calUpd;
  $("sh").onchange=e=>{const t=e.target,k=t.dataset&&t.dataset.k;
    if(k==="start"){const en=$("sh").querySelector('[data-k="end"]');if(en&&(!en.value||en.value<t.value||en.value===t.dataset.p))en.value=t.value;t.dataset.p=t.value}
    if(k==="name"||(t.dataset&&t.dataset.sw!=null)){const kn=known(t.value);const ph=k==="name"?$("sh").querySelector('[data-k="phone"]'):$("sh").querySelector('[data-sp="'+t.dataset.sw+'"]'),tr=$("sh").querySelector('[data-k="trade"]');if(ph&&!ph.value&&kn.p)ph.value=kn.p;if(k==="name"&&tr&&!tr.value&&kn.tr)tr.value=kn.tr}
    calUpd()};
  $("ov").classList.add("on")}
function closeEd(){
  $("ov").classList.remove("on");modalOpen=false;
  const pe=pending;pending=null;ed=null;if(pe)applyRemote(pe);render()}
render();
if(!CODE||!DB_URL)setTimeout(openSetup,500);else if(!ME)setTimeout(openWho,500);
connect();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
